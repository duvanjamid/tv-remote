<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1C2440"/>
      <stop offset="55%" stop-color="#10152A"/>
      <stop offset="100%" stop-color="#070A16"/>
    </radialGradient>

    <linearGradient id="orbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CD"/>
      <stop offset="35%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E1" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFC107" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="padFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECF5"/>
    </linearGradient>

    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <!-- App-icon background -->
  <g clip-path="url(#roundedSquare)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGlow)"/>

    <!-- soft outer glow -->
    <circle cx="256" cy="240" r="190" fill="url(#coreGlow)"/>

    <!-- faint orbit rings, echoing the Jarvis search orb -->
    <ellipse cx="256" cy="240" rx="168" ry="168" fill="none" stroke="url(#orbRing)" stroke-width="2.5" opacity="0.35"/>
    <ellipse cx="256" cy="240" rx="150" ry="62" fill="none" stroke="url(#orbRing)" stroke-width="2" opacity="0.45" transform="rotate(-18 256 240)"/>
    <ellipse cx="256" cy="240" rx="150" ry="62" fill="none" stroke="url(#orbRing)" stroke-width="2" opacity="0.3" transform="rotate(32 256 240)"/>

    <!-- outer amber ring (the "remote signal" halo) -->
    <circle cx="256" cy="240" r="142" fill="none" stroke="url(#orbRing)" stroke-width="10"/>

    <!-- d-pad: four chevrons around a glowing center button -->
    <g fill="url(#padFill)">
      <!-- up -->
      <path d="M256 118 L288 156 L224 156 Z"/>
      <!-- down -->
      <path d="M256 362 L288 324 L224 324 Z"/>
      <!-- left -->
      <path d="M134 240 L172 208 L172 272 Z"/>
      <!-- right -->
      <path d="M378 240 L340 208 L340 272 Z"/>
    </g>

    <!-- center OK button -->
    <circle cx="256" cy="240" r="46" fill="url(#orbRing)"/>
    <circle cx="256" cy="240" r="46" fill="none" stroke="#FFF8E1" stroke-width="3" opacity="0.6"/>

    <!-- wireless signal accent, lower right -->
    <g stroke="url(#orbRing)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M372 400 A56 56 0 0 1 400 372" />
      <path d="M352 420 A84 84 0 0 1 420 352" opacity="0.6"/>
    </g>
    <circle cx="372" cy="400" r="8" fill="url(#orbRing)"/>
  </g>
</svg>
